name: kosha-scout
on:
  schedule: [{ cron: "17 12 * * *" }]   # 12:17 UTC daily
  workflow_dispatch:
permissions: { contents: write }
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scout.py
      - name: commit log
        run: |
          git config user.name "kosha-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scout-log.md && git commit -m "scout $(date -u +%F)" && git push || echo "no changes"
